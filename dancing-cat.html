<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sitting Cat - Furax Dev</title>
<style>
body {
  margin: 0;
  padding: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  font-family: 'Courier New', monospace;
}

.container {
  text-align: center;
  background: rgba(255, 255, 255, 0.1);
  padding: 40px;
  border-radius: 20px;
  backdrop-filter: blur(10px);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
}

h1 {
  color: white;
  margin: 0 0 30px 0;
  font-size: 2.5em;
  text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
}

.ascii-cat {
  font-size: 28px;
  color: #00ff88;
  font-weight: bold;
  text-shadow: 0 0 10px #00ff88;
  white-space: pre;
  line-height: 1.2;
  display: inline-block;
  margin: 20px 0;
  animation: blink 1.5s ease-in-out infinite;
}

@keyframes blink {
  0%, 100% {
    opacity: 1;
  }
  50% {
    opacity: 0.7;
  }
}

</style>
</head>
<body>
<div class="container">
<h1>Sitting Cat</h1>

<pre class="ascii-cat">
  /\_/\
 ( o.o )
  > ^ <
 /|   |\
(_)   (_)
</pre>

<a href="https://github.com/furaxdev/furaxdev" class="back-link">Back to Profile</a>
</div>
</body>
</html>
